<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ofertas — Oferta Mágica</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="estilo.css">
<style>
  /* Página própria: cards de oferta, não o texto institucional do estilo.css */
  body { max-width: 480px; padding-top: 1.8rem; }
  h1 { text-align: center; }
  .sub { text-align: center; }
  #lista { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.6rem; }
  .card { border: 1px solid rgba(128,128,128,.3); border-radius: 14px; overflow: hidden;
          display: flex; flex-direction: column; }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block;
              background: rgba(128,128,128,.12); }
  .card .corpo { padding: .9rem 1rem 1.1rem; }
  .card .titulo { font-size: .95rem; line-height: 1.3; margin: 0 0 .5rem;
                  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                  overflow: hidden; }
  .preco-linha { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
  .preco { font-size: 1.3rem; font-weight: 700; }
  .original { text-decoration: line-through; opacity: .55; font-size: .85rem; }
  .desconto { background: #e63946; color: #fff; font-size: .78rem; font-weight: 700;
              padding: .15rem .45rem; border-radius: 6px; }
  .btn { display: block; text-align: center; margin-top: .7rem; padding: .65rem;
         border-radius: 8px; background: #7C1E87; color: #fff; text-decoration: none;
         font-weight: 600; font-size: .92rem; }
  #vazio, #erro { text-align: center; opacity: .7; margin-top: 2.5rem; font-size: .92rem; }
  #erro { display: none; }
</style>
</head><body>

<h1>🔥 Ofertas de hoje</h1>
<p class="sub">@oferta.magica_ — atualizado ao vivo</p>

<div id="lista"></div>
<p id="vazio" style="display:none">Sem ofertas no ar agora. Volta daqui a pouco.</p>
<p id="erro">Não consegui carregar as ofertas agora. Tenta de novo em instantes.</p>

<footer>
  <a href="index.html">Sobre</a> · <a href="terms.html">Termos</a> ·
  <a href="privacy.html">Privacidade</a>
</footer>

<script>
// 🔑 Esta URL é o caminho /hot aberto no Funnel do servidor (RADOF-070, 20/09/2026) — só
// leitura, só os campos já públicos em qualquer post do Instagram. Ver `app.py` (rota
// `/hot/ofertas.json`) para o que essa API expõe e por quê.
const FONTE = "https://truenas-scale.tail93ce41.ts.net/hot/ofertas.json";

function brl(v) {
  return (v ?? 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

async function carregar() {
  const lista = document.getElementById("lista");
  const vazio = document.getElementById("vazio");
  const erro = document.getElementById("erro");
  try {
    const r = await fetch(FONTE, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const dados = await r.json();
    const ofertas = dados.ofertas || [];
    if (!ofertas.length) { vazio.style.display = "block"; return; }
    lista.innerHTML = ofertas.map(o => `
      <div class="card">
        <img src="${o.imagem}" alt="" loading="lazy">
        <div class="corpo">
          <p class="titulo">${o.titulo || ""}</p>
          <div class="preco-linha">
            <span class="preco">R$ ${brl(o.preco)}</span>
            ${o.preco_original ? `<span class="original">R$ ${brl(o.preco_original)}</span>` : ""}
            ${o.desconto_pct ? `<span class="desconto">-${Math.round(o.desconto_pct)}%</span>` : ""}
          </div>
          <a class="btn" href="${o.link}" target="_blank" rel="nofollow noopener sponsored">Ver oferta</a>
        </div>
      </div>`).join("");
  } catch (e) {
    erro.style.display = "block";
  }
}
carregar();
</script>
</body></html>
